<!DOCTYPE html>
<html>
    <head>
        <title>Getting Forms</title>
    </head>
    <body>
<h1>this is form class</h1>
<form action="#" method="get">
 <h2>Contact Form</h2>

 <label for="name">Full Name</label>
 <input type="text" id="name" name="name" placeholder="Oge Eucharia" tabindex="1"><br>

 <label for="email">Email Address</label>
 <input type="email" id="email" name="email" placeholder="oge@gmail.com" tabindex="2"><br>

 <label for="phone">Phone Number</label>
 <input type="number" id="phone" name="phone" placeholder="+23466666" tabindex="3"><br>

 <button type="submit" tabindex="4">Send a Message</button>


</form>

<button id="btn">clicke here</button>



<button onclick="sayHello()">Click me now</button>

<button id="greetBtn">Greet Me</button>
<p id="message"></p>







<script>
  function sayHello() {
    alert("Hello! there");
  }
</script>


<script src="first.js"></script>

</html>
