<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact / Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h2>Contact / Feedback Form</h2>

        <form id="contactForm">

            <!-- Full Name -->
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>


            <!-- Email -->
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter a valid email address" required>

            <!-- Phone Number -->
            <label for="phone">Phone Number:</label>
            <input type="number" id="phone" name="phone" placeholder="Enter your phone number" required minlength="10">

            <!-- Message -->
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>

            <label for="skills">Skills:</label>
            <input type="checkbox" value="html">HTML
            <input type="checkbox" value="css">css
            <input type="checkbox" value="js">js


            <label for="Gender">Gender</label>
            <input type="radio" name="gender" value="male">male
            <input type="radio" name="gender" value="female"> female


            <label> experience level</label>
            <input type="range" min="1" max="10">


            <label>week</label>
            <input type="week">

             <label>month</label>
            <input type="month">

            <!-- Send Button -->
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        // Simple validation for phone number length
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            const phone = document.getElementById("phone").value;
            if (phone.length < 10) {
                alert("Phone number must be at least 10 digits.");
                event.preventDefault(); // stop form submission
            }
        });
    </script>

</body>
</html>
