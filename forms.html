<!DOCTYPE html>
<html>
    <head>
        <title>Forms</title>
    </head>
    <body>
        <form action="#" method="post">
            <h2>Contact Us</h2>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="oge" required aria-label="Full Name" tabindex="1" />

            <label for="email">Email Address</label>
            <input type="email" id="email"  name="email" placeholder="oge@gmail.com" required aria-label="Email Address" tabindex="2" />

            <label for="phone">Phone Number</label>
            <input type="number" placeholder="081111111" required aria-label="Phone Number" minlength="10" tabindex="3" />

            <button type="submit" tabindex="4">Send Us a Message</button>
        </form>
    </body>
</html>
